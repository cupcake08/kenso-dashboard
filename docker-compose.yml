services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kenso-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${FIREBASE_API_KEY%.*}.firebaseapp.com
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${FIREBASE_PROJECT_ID}.appspot.com
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${FIREBASE_APP_ID}
    networks:
      - kenso

  # Optional: nginx reverse proxy for HTTPS + routing
  nginx-proxy:
    image: nginx:alpine
    container_name: kenso-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-kenso-dashboard.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-secrets:/etc/nginx/secrets:ro
    depends_on:
      - dashboard
      - api
    networks:
      - kenso

networks:
  kenso:
    name: kenso-net

volumes:
  nginx-secrets:
    name: kenso-nginx-secrets
