# kenso-dashboard nginx config
# Place in /etc/nginx/sites-available/kenso-dashboard
# Then symlink: sudo ln -s /etc/nginx/sites-available/kenso-dashboard /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name kenso.yourdomain.com;

    # Redirect HTTP to HTTPS (uncomment after certbot)
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kenso.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/kenso.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kenso.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/kenso-dashboard/.next/standalone;
    access_log /var/log/nginx/kenso-dashboard.access.log;
    error_log /var/log/nginx/kenso-dashboard.error.log;

    # Next.js static files
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        tcp_nodelay on;
    }

    # Next.js pages
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        tcp_nodelay on;
    }

    # Go backend API — proxy to Go server
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        tcp_nodelay on;
    }
}
